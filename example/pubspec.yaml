name: flux_launcher_gui
description: Flux Minecraft Launcher
version: 0.1.0

publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_acrylic:
    path: ../
  flutter_secure_storage_windows: any
  flutter_secure_storage_darwin: any
  flutter_secure_storage_linux: any
  material_color_utilities: any
  bitsdojo_window_macos: 0.1.3
  flutter_secure_storage: any
  simple_3d_renderer: 21.0.0
  flutter_localization: any
  cached_network_image: ^3.4.1
  file_selector_linux: 0.9.2
  url_launcher_linux: any
  shared_preferences: any
  dropdown_button2: any
  bitsdojo_window: ^0.1.5
  flutter_switch: any
  file_selector: any
  url_launcher: any
  system_theme: any
  flutter_html: ^3.0.0
  html: '>=0.15.0 <0.15.7'
  text_divider: any
  file_picker: any
  process_run: any
  http_parser: any
  provider: any
  markdown: any
  archive: any
  encrypt: any
  crypto: any
  image: any
  http: any
  intl: any
  blur: any
  meta: any
  path: any

  cupertino_icons: ^1.0.5

  simple_3d: any
  util_simple_3d: any
  flutter_cache_manager: any
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/flux.png
    - assets/flux-animated.gif
    - assets/alex-raw.png
    - assets/steve-raw.png
    - assets/alpha.png
    - assets/beta.png
    - assets/release.png
    - assets/snapshot.png
    - assets/optifine.png
    - assets/optiforge.png
    - assets/forge.png
    - assets/fabric.png
    - assets/modrinth.png

  fonts:
    - family: FluxIcons
      fonts:
        - asset: fonts/FluxIcons.ttf
    - family: Comfortaa
      fonts:
        - asset: fonts/Comfortaa-Light.ttf
          weight: 300
        - asset: fonts/Comfortaa-Regular.ttf
          weight: 400
        - asset: fonts/Comfortaa-Medium.ttf
          weight: 500
        - asset: fonts/Comfortaa-SemiBold.ttf
          weight: 600
        - asset: fonts/Comfortaa-Bold.ttf
          weight: 700
    - family: JetbrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
