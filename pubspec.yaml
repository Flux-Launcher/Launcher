name: flutter_acrylic
description: Window acrylic, mica & transparency effects for Flutter on Windows, macOS & Linux.
version: 1.1.2

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  macos_window_utils: 1.1.2
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  dart_code_metrics: ^5.6.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: FlutterAcrylicPlugin
      linux:
        pluginClass: FlutterAcrylicPlugin
      macos:
        default_package: macos_window_utils

